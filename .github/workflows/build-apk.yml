name: FitKoçum 3D APK
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@v4
      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle 8.9 kur
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Derleme imzasını geri yükle
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: fitkocum-v2-debug-signing-key
      - name: İmzalama anahtarı oluştur (ilk derleme)
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 7300 -dname "CN=Android Debug,O=FitKocum,C=TR"
          fi
      - name: Gerçekçi anatomik GLB egzersiz modellerini ekle
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets/models app/src/main/assets/thumbs
          curl -fsSL --retry 3 --max-time 180 'https://raw.githubusercontent.com/AssiamahS/opengym3d/main/dist/opengym3d-exercise-pack-v1.zip' -o /tmp/opengym3d.zip
          unzip -joq /tmp/opengym3d.zip 'pack/models/*.glb' -d app/src/main/assets/models
          unzip -joq /tmp/opengym3d.zip 'pack/thumbs/*.png' -d app/src/main/assets/thumbs
          unzip -p /tmp/opengym3d.zip pack/LICENSE > app/src/main/assets/OPEN_GYM_LICENSE.txt
          test "$(find app/src/main/assets/models -name '*.glb' | wc -l)" -eq 24
          echo "24 gerçek 3D model eklendi"
          du -sh app/src/main/assets/models
      - name: İlave 36 mobilite ve ısınma hareketini ekle
        run: |
          curl -fsSL --retry 3 --max-time 150 'https://raw.githubusercontent.com/shlomorsh/desk-break/main/library/exercises.glb' -o app/src/main/assets/models/mobility.glb
          curl -fsSL --retry 3 --max-time 30 'https://raw.githubusercontent.com/shlomorsh/desk-break/main/LICENSE' -o app/src/main/assets/DESK_BREAK_LICENSE.txt
          test -s app/src/main/assets/models/mobility.glb
          du -h app/src/main/assets/models/mobility.glb
      - name: MoveKit ücretsiz lisanslı örnek videolarını APK'ya ekle
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets/movekit/posters
          curl -fSL --retry 3 --retry-delay 3 --max-time 150 'https://movekit.com/downloads/movekit-free-sample.zip' -o /tmp/movekit-free-sample.zip
          unzip -tq /tmp/movekit-free-sample.zip >/dev/null
          unzip -p /tmp/movekit-free-sample.zip pull-ups.mp4 > app/src/main/assets/movekit/pull-ups.mp4
          unzip -p /tmp/movekit-free-sample.zip dumbbell-chest-fly.mp4 > app/src/main/assets/movekit/dumbbell-chest-fly.mp4
          unzip -p /tmp/movekit-free-sample.zip posters/pull-ups.png > app/src/main/assets/movekit/posters/pull-ups.png
          unzip -p /tmp/movekit-free-sample.zip posters/dumbbell-chest-fly.png > app/src/main/assets/movekit/posters/dumbbell-chest-fly.png
          unzip -p /tmp/movekit-free-sample.zip LICENSE.txt > app/src/main/assets/movekit/LICENSE.txt
          for file in app/src/main/assets/movekit/*.mp4 app/src/main/assets/movekit/posters/*.png app/src/main/assets/movekit/LICENSE.txt; do
            test -s "$file"
          done
          printf 'MoveKit free sample packaged for in-app playback: '
          du -sh app/src/main/assets/movekit
      - name: Three.js 3D motorunu paketle
        run: |
          npm install --no-save --no-package-lock --ignore-scripts three@0.180.0 esbuild@0.25.12
          ./node_modules/.bin/esbuild web-src/realistic-viewer.js --bundle --minify --format=iife --target=es2020 --outfile=app/src/main/assets/realistic-viewer.js
          test -s app/src/main/assets/realistic-viewer.js
      - name: Çevrimdışı video arşivini indir ve sıkıştır
        timeout-minutes: 75
        env:
          FIT_VIDEO_LIMIT: '317'
          FIT_VIDEO_WORKERS: '7'
        run: |
          set -euo pipefail
          command -v ffmpeg >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y ffmpeg)
          node --check tools/build-offline-videos.cjs
          node tools/build-offline-videos.cjs
          node --check app/src/main/assets/offline-video-index.js
          du -sh app/src/main/assets/offline-videos
      - name: Huawei Watch Fit 5 Pro gerçek MP4 kliplerini hazırla
        run: |
          set -euo pipefail
          node --check tools/build-watch-videos.cjs
          node tools/build-watch-videos.cjs
          node tests/watch-videos.cjs
      - name: Saate aktarılabilir MP4 dosyalarını yayınla
        uses: actions/upload-artifact@v4
        with:
          name: FitKocum-WatchFit5Pro-v4.1-5-MP4
          path: |
            app/src/main/assets/watch-videos/*.mp4
            app/src/main/assets/watch-videos/README.txt
          if-no-files-found: error
          retention-days: 30
      - name: JavaScript ve çevrimdışı video dosyalarını doğrula
        run: |
          node --check app/src/main/assets/weekly-v31.js
          node --check app/src/main/assets/video-v31.js
          node --check app/src/main/assets/free-exercise-data.js
          node --check app/src/main/assets/exercise-search-v321.js
          node tests/exercise-search.cjs
          node --check app/src/main/assets/exercise-filters-v322.js
          node tests/exercise-filters.cjs
          node tests/free-exercise-videos.cjs
      - name: APK oluştur
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: APK dosyasını sakla
        uses: actions/upload-artifact@v4
        with:
          name: FitKocum-v4.1-WATCH-LAB-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
