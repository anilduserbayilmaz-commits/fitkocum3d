name: FitKoçum 3D APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@v4
      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle 8.9 kur
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Derleme imzasını geri yükle
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: fitkocum-v2-debug-signing-key
      - name: İmzalama anahtarı oluştur (ilk derleme)
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 7300 -dname "CN=Android Debug,O=FitKocum,C=TR"
          fi
      - name: APK oluştur
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: APK dosyasını sakla
        uses: actions/upload-artifact@v4
        with:
          name: FitKocum-3D-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
