name: FitKoçum 3D APK
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@v4
      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle 8.9 kur
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Derleme imzasını geri yükle
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: fitkocum-v2-debug-signing-key
      - name: İmzalama anahtarı oluştur (ilk derleme)
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 7300 -dname "CN=Android Debug,O=FitKocum,C=TR"
          fi
      - name: Gerçekçi anatomik GLB egzersiz modellerini ekle
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets/models app/src/main/assets/thumbs
          curl -fsSL --retry 3 --max-time 180 'https://raw.githubusercontent.com/AssiamahS/opengym3d/main/dist/opengym3d-exercise-pack-v1.zip' -o /tmp/opengym3d.zip
          unzip -joq /tmp/opengym3d.zip 'pack/models/*.glb' -d app/src/main/assets/models
          unzip -joq /tmp/opengym3d.zip 'pack/thumbs/*.png' -d app/src/main/assets/thumbs
          unzip -p /tmp/opengym3d.zip pack/LICENSE > app/src/main/assets/OPEN_GYM_LICENSE.txt
          test "$(find app/src/main/assets/models -name '*.glb' | wc -l)" -eq 24
          echo "24 gerçek 3D model eklendi"
          du -sh app/src/main/assets/models
      - name: İlave 36 mobilite ve ısınma hareketini ekle
        run: |
          curl -fsSL --retry 3 --max-time 150 'https://raw.githubusercontent.com/shlomorsh/desk-break/main/library/exercises.glb' -o app/src/main/assets/models/mobility.glb
          curl -fsSL --retry 3 --max-time 30 'https://raw.githubusercontent.com/shlomorsh/desk-break/main/LICENSE' -o app/src/main/assets/DESK_BREAK_LICENSE.txt
          test -s app/src/main/assets/models/mobility.glb
          du -h app/src/main/assets/models/mobility.glb
      - name: Three.js 3D motorunu paketle
        run: |
          npm install --no-save --no-package-lock --ignore-scripts three@0.180.0 esbuild@0.25.12
          ./node_modules/.bin/esbuild web-src/realistic-viewer.js --bundle --minify --format=iife --target=es2020 --outfile=app/src/main/assets/realistic-viewer.js
          test -s app/src/main/assets/realistic-viewer.js
      - name: v3.1 JavaScript sözdizimi kontrolü
        run: node --check app/src/main/assets/weekly-v31.js
      - name: APK oluştur
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: APK dosyasını sakla
        uses: actions/upload-artifact@v4
        with:
          name: FitKocum-3D-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
