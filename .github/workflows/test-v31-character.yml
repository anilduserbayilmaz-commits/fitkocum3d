name: v3.1 realistic three-exercise visual proof
on:
  workflow_dispatch:
  push:
    paths:
      - 'prototypes/v31/**'
      - 'tests/v31/**'
      - '.github/workflows/test-v31-character.yml'
permissions: {contents: read}
jobs:
  prototype:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Download licensed CC0 character clothing and selected exercise
        run: |
          set -euo pipefail
          mkdir -p /tmp/v31
          for file in base_body_anim clothing_shorts clothing_tshirt clothing_shoes hair_short04; do
            curl -fsSL --retry 3 --max-time 120 "https://raw.githubusercontent.com/kblood/CharacterCreator/master/output/${file}.glb" -o "/tmp/v31/${file}.glb"
          done
          mv /tmp/v31/base_body_anim.glb /tmp/v31/realistic_body.glb
          mv /tmp/v31/clothing_shorts.glb /tmp/v31/realistic_shorts.glb
          mv /tmp/v31/clothing_tshirt.glb /tmp/v31/realistic_tshirt.glb
          mv /tmp/v31/clothing_shoes.glb /tmp/v31/realistic_shoes.glb
          mv /tmp/v31/hair_short04.glb /tmp/v31/realistic_hair.glb
          curl -fsSL --retry 3 --max-time 120 'https://raw.githubusercontent.com/AssiamahS/opengym3d/main/dist/opengym3d-exercise-pack-v1.zip' -o /tmp/v31/pack.zip
          unzip -joq /tmp/v31/pack.zip 'pack/models/bicep_curl.glb' 'pack/models/squat.glb' 'pack/models/deadlift.glb' -d /tmp/v31
          ls -lh /tmp/v31/*.glb
      - name: Build isolated preview (not included in APK)
        run: |
          npm install --no-save --no-package-lock --ignore-scripts three@0.180.0 esbuild@0.25.12 playwright-core@1.56.1
          ./node_modules/.bin/esbuild prototypes/v31/retarget-preview.js --bundle --minify --format=iife --target=es2020 --outfile=/tmp/v31/v31-retarget-bundle.js
      - name: Test character dressing and human movement in Chrome WebGL
        run: node tests/v31/retarget-visual.cjs
      - name: Upload visual proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v31-realistic-three-exercise-previews
          path: /tmp/v31/*.png
          if-no-files-found: warn
          retention-days: 14
