name: Publish direct APK download
on:
  push:
    paths:
      - '.github/workflows/publish-apk.yml'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download verified v3.0 APK
        run: |
          mkdir -p /tmp/fitkocum
          gh run download 42290968763 --repo anilduserbayilmaz-commits/fitkocum3d --name FitKocum-3D-APK --dir /tmp/fitkocum
          test -s /tmp/fitkocum/app-debug.apk
          cp /tmp/fitkocum/app-debug.apk FitKocum3D-Plus-v3.0.apk
          unzip -t FitKocum3D-Plus-v3.0.apk | tail -1
          sha256sum FitKocum3D-Plus-v3.0.apk
      - name: Publish direct install file
        run: |
          gh release create v3.0.0 FitKocum3D-Plus-v3.0.apk --repo anilduserbayilmaz-commits/fitkocum3d --title 'FitKoçum 3D+ v3.0' --notes 'FitKoçum 3D+ v3.0: 390 individually named 3D exercises (24 anatomical strength animations, five equipment technique scenes and 361 exercise-specific mobility, yoga, cardio, chair, balance and stretching clips). 325 new clips originate from the MIT-licensed Desk Break collection, license and credit included. Game-style 3D athlete with improved body proportions, skin, face, hair, gym clothes and sneakers bound to the exercise skeleton, plus Arena/Pulse/Carbon outfits and original mannequin fallback. Search, 16 categories, favorites and progressive load-more in exercise Atlas; chair and yoga mat stage props. Existing workout planner, custom set and rep editing, recorded sets, smart progression, food log, offline playback preserved. All 361 movement IDs were cross-checked against 435 stored clips and the WebGL regression suite passed. Android APK successfully built. Character is stylized, not photorealistic or motion-captured; 300+ strength lifts are not claimed. Device testing on Pixel 9 still pending.'
          gh release view v3.0.0 --repo anilduserbayilmaz-commits/fitkocum3d --json assets,url
