name: Publish direct APK download
on:
  push:
    paths:
      - '.github/workflows/publish-apk.yml'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download verified v2.2 APK
        run: |
          mkdir -p /tmp/fitkocum
          gh run download 42284620971 --repo anilduserbayilmaz-commits/fitkocum3d --name FitKocum-3D-APK --dir /tmp/fitkocum
          test -s /tmp/fitkocum/app-debug.apk
          cp /tmp/fitkocum/app-debug.apk FitKocum3D-Plus-v2.2.apk
          unzip -t FitKocum3D-Plus-v2.2.apk | tail -1
          sha256sum FitKocum3D-Plus-v2.2.apk
      - name: Publish direct install file
        run: |
          gh release create v2.2.0 FitKocum3D-Plus-v2.2.apk --repo anilduserbayilmaz-commits/fitkocum3d --title 'FitKoçum 3D+ v2.2' --notes 'FitKoçum 3D+ v2.2 Android APK. New native, skeletal-animation-following 3D muscle region tinting: primary muscles in orange, secondary/supporting muscles in turquoise, with Off/Primary/All options and Turkish muscle names. Supports the 24 rigged anatomical movements and five equipment technique demonstrations. Existing 36 mobility animations intentionally show no inaccurate muscle diagram. Colors are educational approximate regions, not precise biomechanical or EMG measurements. Premium offline gym, correct-vs-common-error guides, 65 exercise library, personalized training, smart coach and meal records retained. Chromium WebGL regression, editable native vertex-color tests, data persistence and Android APK build passed. Physical Pixel 9 device test pending.'
          gh release view v2.2.0 --repo anilduserbayilmaz-commits/fitkocum3d --json assets,url
